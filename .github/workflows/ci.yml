name: CI
on:
  push:
  pull_request:
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @emmett/web lint
      - run: pnpm --filter @emmett/web typecheck
      - run: pnpm --filter @emmett/web test
      - run: pnpm --filter @emmett/web content:check
      - run: pnpm --filter @emmett/web content:check -- --self-test
      - run: pnpm --filter @emmett/web jalali:check
      - run: pnpm --filter @emmett/web corpus:check
      - run: pnpm --filter @emmett/web tool:contract
      - run: pnpm --filter @emmett/web api:types
      - run: git diff --exit-code -- web/src/lib/api-types.ts
      - run: pnpm --filter @emmett/web build
      - run: pnpm --filter @emmett/web budget
      - run: pnpm --filter @emmett/web budget -- --self-test
      - run: pnpm --filter @emmett/web seo:render
        env:
          PUBLIC_SITE_URL: https://ci.example.invalid
      - run: pnpm --filter @emmett/web seo:check
      - run: pnpm --filter @emmett/web exec playwright install --with-deps chromium
      - name: Run a11y (Playwright + axe)
        shell: bash
        env:
          FORCE_COLOR: '0'
          NO_COLOR: '1'
          A11Y_REPORT: /tmp/axe-violations.json
          PLAYWRIGHT_JSON_OUTPUT_NAME: /tmp/a11y.json
        run: |
          set -o pipefail
          rm -f /tmp/axe-violations*.json
          pnpm --filter @emmett/web exec playwright test --reporter=list,json 2>&1 | tee /tmp/a11y.log
      - name: Capture per-feature evidence screenshots (fa + en, zero console errors)
        shell: bash
        run: pnpm --filter @emmett/web exec playwright test tests/e2e/evidence.spec.ts --reporter=list
      - name: Upload feature evidence screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-evidence
          path: web/test-results/evidence
          if-no-files-found: warn
      - name: Report a11y failures
        if: failure()
        shell: bash
        run: |
          { echo '### a11y log tail'; echo '```'; tail -n 80 /tmp/a11y.log 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          node web/scripts/report-playwright-failures.mjs /tmp/a11y.json /tmp/axe-violations.json
          exit 0
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @emmett/web build
      - run: pnpm --filter @emmett/web seo:render
        env:
          PUBLIC_SITE_URL: https://ci.example.invalid
      - name: Lighthouse mobile, low-power tier (Perf >= 90, CLS < 0.1)
        run: npx --yes @lhci/cli@0.14.0 autorun
        working-directory: web
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: web/lhci-reports
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: api/requirements/dev.txt }
      - run: pip install -r requirements/dev.txt
      - run: ruff check apps emmett manage.py
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: pytest --cov=apps.jobs --cov=apps.leads --cov=apps.content --cov-report=term-missing --cov-fail-under=80
      - run: python manage.py spectacular --file schema.yml --validate --fail-on-warn
      - run: git diff --exit-code -- schema.yml
      - run: pip-audit -r requirements/base.txt --strict
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }  # gitleaks walks the commit range; a shallow clone fails it
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Report gitleaks failures
        if: failure()
        shell: bash
        run: echo "::error::gitleaks failed — see .gitleaks.toml for the documented allowlist (sample JWTs and .env.example placeholders)." 
  queue-race:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: emmett
          MARIADB_USER: emmett
          MARIADB_PASSWORD: emmett
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements/dev.txt mysqlclient==2.2.7
      - name: Grant the test database to the app user
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot -e "GRANT ALL PRIVILEGES ON *.* TO 'emmett'@'%'; FLUSH PRIVILEGES;" && echo "granted emmett the throwaway CI database"
      - name: Run queue-race test
        shell: bash
        env:
          DB_ENGINE: mysql
          DB_NAME: emmett
          DB_USER: emmett
          DB_PASSWORD: emmett
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
        run: |
          set -o pipefail
          pytest apps/jobs/test_jobs.py -q 2>&1 | tee /tmp/pytest.log
      - name: Report queue-race failures
        if: failure()
        shell: bash
        run: |
          { echo '### queue-race log tail'; echo '```'; tail -n 80 /tmp/pytest.log 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep -aE '^(FAILED|ERROR|Traceback)|^E |sql = |OperationalError|ProgrammingError|Permission denied' /tmp/pytest.log 2>/dev/null | head -40 | while IFS= read -r line; do echo "::error::qr: ${line:0:900}"; done
          tail -n 30 /tmp/pytest.log 2>/dev/null | while IFS= read -r line; do echo "::error::qr-log: ${line:0:900}"; done
          exit 0
