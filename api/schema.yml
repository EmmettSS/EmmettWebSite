components:
  schemas:
    Contact:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
        message:
          type: string
          maxLength: 5000
        locale:
          allOf:
          - $ref: '#/components/schemas/LocaleEnum'
          default: fa
        website:
          type: string
          writeOnly: true
      required:
      - email
      - message
      - name
    Content:
      type: object
      properties:
        slug:
          type: string
        slug_fa:
          type: string
        title:
          type: string
        body:
          type: string
        published_at:
          type: string
          format: date-time
          nullable: true
      required:
      - body
      - slug
      - slug_fa
      - title
    Health:
      type: object
      properties:
        status:
          type: string
        version:
          type: string
        db:
          type: string
        uptime:
          type: integer
      required:
      - db
      - status
      - uptime
      - version
    JobApplication:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
        role:
          type: string
          maxLength: 120
        cover_letter:
          type: string
          maxLength: 5000
        website:
          type: string
          writeOnly: true
          maxLength: 200
      required:
      - email
      - name
      - role
    LocaleEnum:
      enum:
      - fa
      - en
      type: string
      description: |-
        * `fa` - fa
        * `en` - en
    Newsletter:
      type: object
      properties:
        email:
          type: string
          format: email
        locale:
          allOf:
          - $ref: '#/components/schemas/LocaleEnum'
          default: fa
        website:
          type: string
      required:
      - email
    NewsletterToken:
      type: object
      properties:
        token:
          type: string
          maxLength: 400
      required:
      - token
    SiteConfig:
      type: object
      properties:
        brand_en:
          type: string
        brand_fa:
          type: string
        telegram_handle:
          type: string
        building_fa:
          type: string
        building_en:
          type: string
      required:
      - brand_en
      - brand_fa
      - building_en
      - building_fa
      - telegram_handle
    Team:
      type: object
      properties:
        name_fa:
          type: string
        name_en:
          type: string
        role_fa:
          type: string
        role_en:
          type: string
      required:
      - name_en
      - name_fa
      - role_en
      - role_fa
    ToolCatalogResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: {}
        count:
          type: integer
      required:
      - count
      - items
    Waitlist:
      type: object
      properties:
        product:
          type: string
          maxLength: 80
        email:
          type: string
          format: email
        use_case:
          type: string
          maxLength: 2000
        website:
          type: string
      required:
      - email
      - product
