components:
  schemas:
    Ask:
      type: object
      properties:
        question:
          type: string
        locale:
          allOf:
          - $ref: '#/components/schemas/LocaleEnum'
          default: fa
        session_id:
          type: string
          maxLength: 64
        consent_to_log:
          type: boolean
          default: false
        website:
          type: string
          writeOnly: true
      required:
      - question
    AskAccepted:
      type: object
      properties:
        job_id:
          type: integer
        state:
          type: string
        mode:
          type: string
        disclosure:
          type: string
      required:
      - disclosure
      - job_id
      - mode
      - state
    AssistantPollResponse:
      type: object
      properties:
        job_id:
          type: integer
        state:
          type: string
        progress:
          type: array
          items: {}
        offset_next:
          type: integer
        result:
          nullable: true
        error:
          type: string
          nullable: true
      required:
      - job_id
      - offset_next
      - progress
      - state
    Contact:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
        message:
          type: string
          maxLength: 5000
        locale:
          allOf:
          - $ref: '#/components/schemas/LocaleEnum'
          default: fa
        website:
          type: string
          writeOnly: true
      required:
      - email
      - message
      - name
    Content:
      type: object
      properties:
        slug:
          type: string
        slug_fa:
          type: string
        title:
          type: string
        body:
          type: string
        published_at:
          type: string
          format: date-time
          nullable: true
      required:
      - body
      - slug
      - slug_fa
      - title
    Feedback:
      type: object
      properties:
        answer_id:
          type: integer
        helpful:
          type: boolean
      required:
      - answer_id
      - helpful
    Health:
      type: object
      properties:
        status:
          type: string
        version:
          type: string
        db:
          type: string
        uptime:
          type: integer
      required:
      - db
      - status
      - uptime
      - version
    HolidayCalendarResponse:
      type: object
      properties:
        year:
          type: integer
        version:
          type: string
        source:
          type: string
        coverage:
          type: string
        note_fa:
          type: string
        note_en:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/HolidayItem'
      required:
      - coverage
      - items
      - note_en
      - note_fa
      - source
      - version
      - year
    HolidayItem:
      type: object
      properties:
        date:
          type: string
        label:
          type: string
        label_en:
          type: string
        kind:
          type: string
      required:
      - date
      - kind
      - label
      - label_en
    JalaliConvertResponse:
      type: object
      properties:
        jalali:
          type: string
        gregorian:
          type: string
        weekday_fa:
          type: string
        weekday_en:
          type: string
        day_of_year:
          type: integer
        leap_year:
          type: boolean
      required:
      - day_of_year
      - gregorian
      - jalali
      - leap_year
      - weekday_en
      - weekday_fa
    JobApplication:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
        role:
          type: string
          maxLength: 120
        cover_letter:
          type: string
          maxLength: 5000
        website:
          type: string
          writeOnly: true
          maxLength: 200
      required:
      - email
      - name
      - role
    LocaleEnum:
      enum:
      - fa
      - en
      type: string
      description: |-
        * `fa` - fa
        * `en` - en
    Newsletter:
      type: object
      properties:
        email:
          type: string
          format: email
        locale:
          allOf:
          - $ref: '#/components/schemas/LocaleEnum'
          default: fa
        website:
          type: string
      required:
      - email
    NewsletterToken:
      type: object
      properties:
        token:
          type: string
          maxLength: 400
      required:
      - token
    NormalizeChange:
      type: object
      properties:
        rule:
          type: string
        count:
          type: integer
        samples:
          type: array
          items:
            type: string
      required:
      - count
      - rule
      - samples
    NormalizeRequest:
      type: object
      properties:
        text:
          type: string
          maxLength: 50000
        rules:
          type: array
          items:
            $ref: '#/components/schemas/RulesEnum'
      required:
      - text
    NormalizeResponse:
      type: object
      properties:
        normalized:
          type: string
        changes:
          type: array
          items:
            $ref: '#/components/schemas/NormalizeChange'
        total:
          type: integer
        rules_version:
          type: string
      required:
      - changes
      - normalized
      - rules_version
      - total
    RulesEnum:
      enum:
      - yeh
      - kaf
      - digits
      - latin-digits
      - diacritics
      - zwnj
      - spaces
      - quotes
      - ra
      - kashida
      type: string
      description: |-
        * `yeh` - yeh
        * `kaf` - kaf
        * `digits` - digits
        * `latin-digits` - latin-digits
        * `diacritics` - diacritics
        * `zwnj` - zwnj
        * `spaces` - spaces
        * `quotes` - quotes
        * `ra` - ra
        * `kashida` - kashida
    ScanCreatedResponse:
      type: object
      properties:
        job_id:
          type: integer
        result_id:
          type: string
          nullable: true
        domain:
          type: string
        blocklist_version:
          type: string
        estimated_seconds:
          type: integer
      required:
      - blocklist_version
      - domain
      - estimated_seconds
      - job_id
      - result_id
    ScanPollResponse:
      type: object
      properties:
        job_id:
          type: integer
        state:
          type: string
        progress:
          type: array
          items: {}
        offset_next:
          type: integer
        result:
          nullable: true
        error:
          type: string
          nullable: true
      required:
      - job_id
      - offset_next
      - progress
      - state
    ScanRequest:
      type: object
      properties:
        domain:
          type: string
          maxLength: 253
        consent:
          type: boolean
        locale:
          allOf:
          - $ref: '#/components/schemas/LocaleEnum'
          default: fa
        website:
          type: string
          writeOnly: true
      required:
      - consent
      - domain
    ScanResultResponse:
      type: object
      properties:
        result_id:
          type: string
        domain:
          type: string
        grade:
          type: string
        score:
          type: integer
        created_at:
          type: string
        expires_at:
          type: string
        ttl_days:
          type: integer
        noindex:
          type: boolean
        blocklist_version:
          type: string
        sections:
          type: array
          items: {}
        internal:
          type: boolean
      required:
      - blocklist_version
      - created_at
      - domain
      - expires_at
      - grade
      - internal
      - noindex
      - result_id
      - score
      - sections
      - ttl_days
    ScanUnlock:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    ShareCreate:
      type: object
      properties:
        tool:
          $ref: '#/components/schemas/ToolEnum'
        locale:
          allOf:
          - $ref: '#/components/schemas/LocaleEnum'
          default: fa
        summary_fa:
          type: string
          maxLength: 400
        summary_en:
          type: string
          maxLength: 400
        params:
          type: object
          additionalProperties:
            type: string
            maxLength: 400
      required:
      - summary_en
      - summary_fa
      - tool
    ShareDetail:
      type: object
      properties:
        share_id:
          type: string
        tool:
          type: string
        locale:
          type: string
        summary_fa:
          type: string
        summary_en:
          type: string
        params:
          type: object
          additionalProperties: {}
        created_at:
          type: string
          format: date-time
      required:
      - created_at
      - locale
      - params
      - share_id
      - summary_en
      - summary_fa
      - tool
    ShareResponse:
      type: object
      properties:
        share_id:
          type: string
        path:
          type: string
        permanent:
          type: boolean
        noindex:
          type: boolean
      required:
      - noindex
      - path
      - permanent
      - share_id
    SiteConfig:
      type: object
      properties:
        brand_en:
          type: string
        brand_fa:
          type: string
        telegram_handle:
          type: string
        building_fa:
          type: string
