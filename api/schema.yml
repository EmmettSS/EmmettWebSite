openapi: 3.0.3
info:
  title: Emmett API
  version: 1.0.0
  description: Emmett public and product API
paths:
  /api/v1/assistant/ask/:
    post:
      operationId: v1_assistant_ask_create
      description: DRF calls ``view.throttled()`` (not the throttle class), so the
        view carries the mixin.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Ask'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Ask'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Ask'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskAccepted'
          description: ''
  /api/v1/assistant/ask/{job_id}/poll/:
    get:
      operationId: v1_assistant_ask_poll_retrieve
      description: Reusable short-poll response. Subclasses define job_kind and permissions.
      parameters:
      - in: path
        name: job_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - {}
