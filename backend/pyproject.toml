[tool.mypy]
plugins = ["mypy_django_plugin.main"]
python_version = "3.11"
strict = true
exclude = ["migrations/", ".venv/"]

# محدودیت شناخته‌شدهٔ بالادستی django-stubs: وقتی مدل پایه (اینجا BaseModel در
# apps.core.models) یک منیجر سفارشی از طریق ``Manager.from_queryset(...)``
# تعریف می‌کند (که تقریباً همهٔ مدل‌های این پروژه چنین‌اند)، پلاگین mypy نمی‌تواند
# نوع related manager معکوس (reverse FK accessor) هیچ رابطه‌ای را که به آن مدل
# اشاره دارد resolve کند و یک false-positive با کد ``django-manager-missing``
# می‌دهد — حتی برای روابط کاملاً معتبر که ``manage.py check`` و تست‌ها آن‌ها را
# تأیید می‌کنند. این یک باگ باز و حل‌نشدهٔ شناخته‌شده در django-stubs است
# (ر.ک. typeddjango/django-stubs#2512 و #1354)، نه یک خطای واقعی در کد ما؛
# بنابراین این کد خطا به‌صورت سراسری غیرفعال شده تا نویز کاذب روی هر مدل/رابطهٔ
# جدید این پروژه تکرار نشود.
disable_error_code = ["django-manager-missing"]

# Django ادمین/فرم‌ها/migrationها الگوهای پویا دارند که strict بودن کامل روی
# آن‌ها ارزش عملی کمی دارد و نویز زیادی تولید می‌کند؛ migrationها به‌طور کامل
# از بررسی mypy مستثنی هستند (کد تولیدشدهٔ خودکار Django است).
[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true

# django-jazzmin و django-import-export (فاز ۶ — ADR-0028/ADR-0029) هیچ
# ``py.typed``/stub ندارند. تنها جایی که مستقیماً از کلاس‌هایشان ارث‌بری می‌کنیم
# با ``# type: ignore[misc]`` علامت‌گذاری شده تا محدودیت صریح و قابل‌ردیابی باشد.
[[tool.mypy.overrides]]
module = ["import_export.*", "jazzmin.*"]
ignore_missing_imports = true

# django-otp و qrcode (فاز ۷ — ADR-0032) هم ``py.typed`` ندارند. مصرف آن‌ها
# محدود به دو ماژول (twofa/twofa_views) است و همهٔ نقاط تماس با API آن‌ها
# با تست‌های ۲FA پوشش داده شده‌اند؛ بنابراین import ناشناخته در سطح
# ``ignore_missing_imports`` پذیرفته می‌شود تا strict بودن بقیهٔ پروژه حفظ شود.
[[tool.mypy.overrides]]
module = ["django_otp.*", "qrcode.*"]
ignore_missing_imports = true

# django-environ هنوز stub رسمی ندارد؛ polib (ابزار i18n فاز ۶، فقط dev) هم
# فاقد stub است و فقط در ``scripts/i18n.py`` و تست ابزار i18n استفاده می‌شود.
[[tool.mypy.overrides]]
module = ["environ.*", "polib.*"]
ignore_missing_imports = true

# Markdown/nh3/jdatetime/django-filter (فاز ۴) هیچ‌کدام stub رسمی/py.typed
# معتبر برای این نسخه ندارند (ADR-0021/ADR-0022).
[[tool.mypy.overrides]]
module = ["markdown.*", "nh3.*", "jdatetime.*", "django_filters.*"]
ignore_missing_imports = true

# factory_boy از py.typed پشتیبانی می‌کند، اما در ترکیب با الگوهای پویای
# DjangoModelFactory در کد تست، سخت‌گیری کامل strict ارزش عملی کمی دارد؛
# این سطح در فایل‌های تست (نه کد اپلیکیشن) اندکی کاهش می‌یابد.
[[tool.mypy.overrides]]
module = "*.tests.*"
disallow_untyped_decorators = false
disallow_untyped_calls = false
warn_return_any = false

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["DJ001"]

[tool.black]
line-length = 110
target-version = ["py311"]
extend-exclude = '''
/(
  migrations
  | \.venv
)/
'''

[tool.bandit]
exclude_dirs = ["tests", "migrations", ".venv"]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
