{% extends "admin/base_site.html" %}
{% load i18n %}

{% block bodyclass %}{{ block.super }} emmett-auth-page{% endblock %}
{% block breadcrumbs %}
<div class="breadcrumbs">
    <a href="{% url 'admin:index' %}">{% translate "Home" %}</a>
    <span aria-hidden="true">›</span>
    <span aria-current="page">{{ title }}</span>
</div>
{% endblock %}

{% block content %}
    <section class="emmett-auth-shell" aria-labelledby="emmett-auth-title">
        <div class="emmett-2fa-card">
            <header class="emmett-2fa-card__title">
                <h1 id="emmett-auth-title">{{ title }}</h1>
            </header>
            <div class="emmett-2fa-card__content">
                {% block twofa_content %}{% endblock %}
            </div>
        </div>
    </section>
{% endblock %}
