{% load i18n static %}<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'fa' }}" dir="{% if LANGUAGE_BIDI %}rtl{% else %}ltr{% endif %}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% translate "Page removed" %}</title>
    <meta name="robots" content="noindex">
    <style>
        :root { color-scheme: light dark; }
        body { font-family: Vazirmatn, Inter, system-ui, sans-serif; margin: 0; min-height: 100vh;
               display: grid; place-items: center; background: #f6f7fb; color: #1c1f2b; }
        main { max-width: 34rem; padding: 2.5rem; background: #fff; border-radius: 1rem;
               box-shadow: 0 10px 40px rgba(31, 34, 51, .08); text-align: center; }
        h1 { margin: 0 0 .5rem; font-size: 1.75rem; color: #5b62e0; }
        p { line-height: 1.9; color: #4a4f63; margin: .5rem 0 1.5rem; }
        a { color: #1fae6e; font-weight: 600; text-decoration: none; }
        @media (prefers-color-scheme: dark) {
            body { background: #12141c; color: #eef0f7; }
            main { background: #1b1e2a; box-shadow: none; }
            p { color: #b9bece; }
        }
    </style>
</head>
<body>
<main>
    <h1>410 — {% translate "Page removed" %}</h1>
    <p>
        {% translate "This page has been permanently removed. The address will not come back, so please update your bookmarks." %}
    </p>
    <a href="/">{% translate "Back to home" %}</a>
</main>
</body>
</html>
